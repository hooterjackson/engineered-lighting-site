<svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="880" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#111">Stage 3 + the USB-CAN sniffer — where the CANable joins the bus</text>
  <text x="30" y="56" font-size="12" fill="#555">The sniffer is a third listener on the same two wires. It taps mid-span, its own terminator stays OFF, and its ground is not optional.</text>

  <!-- Legend -->
  <g font-size="11" fill="#333">
    <rect x="890" y="18" width="295" height="76" fill="#fbfbfb" stroke="#ccc" rx="6"/>
    <line x1="902" y1="40" x2="930" y2="40" stroke="#d62828" stroke-width="3"/><text x="938" y="44">+12 V motor power</text>
    <line x1="902" y1="58" x2="930" y2="58" stroke="#222" stroke-width="3"/><text x="938" y="62">GND (all one net)</text>
    <line x1="902" y1="76" x2="930" y2="76" stroke="#7b2d8b" stroke-width="3"/><text x="938" y="80">3.3 V logic</text>
    <line x1="1050" y1="40" x2="1078" y2="40" stroke="#e8871e" stroke-width="3"/><text x="1086" y="44">CAN H</text>
    <line x1="1050" y1="58" x2="1078" y2="58" stroke="#b8860b" stroke-width="3"/><text x="1086" y="62">CAN L</text>
  </g>

  <!-- ESP32 -->
  <rect x="40" y="110" width="185" height="150" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="132" y="136" font-size="13" font-weight="bold" text-anchor="middle" fill="#223">ESP32-C6</text>
  <text x="132" y="151" font-size="10" text-anchor="middle" fill="#556">USB-C to computer</text>
  <g font-size="11" fill="#223" text-anchor="end">
    <text x="217" y="170">3V3</text><text x="217" y="198">GND</text>
    <text x="217" y="224">GPIO6</text><text x="217" y="248">GPIO7</text>
  </g>

  <!-- Transceiver -->
  <rect x="330" y="110" width="175" height="165" fill="#eefaf1" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="417" y="136" font-size="13" font-weight="bold" text-anchor="middle" fill="#223">SN65HVD230</text>
  <text x="417" y="151" font-size="10" text-anchor="middle" fill="#556">CAN transceiver</text>
  <g font-size="11" fill="#223">
    <text x="338" y="170">3V3</text><text x="338" y="198">GND</text>
    <text x="338" y="224">CTX</text><text x="338" y="248">CRX</text>
  </g>
  <g font-size="11" fill="#223" text-anchor="end">
    <text x="497" y="170">CANH</text><text x="497" y="198">CANL</text>
  </g>
  <line x1="225" y1="166" x2="330" y2="166" stroke="#7b2d8b" stroke-width="3"/>
  <line x1="225" y1="194" x2="330" y2="194" stroke="#222" stroke-width="3"/>
  <line x1="225" y1="220" x2="330" y2="220" stroke="#1d6fd6" stroke-width="3"/>
  <line x1="225" y1="244" x2="330" y2="244" stroke="#0f8a3d" stroke-width="3"/>

  <!-- CAN trunk -->
  <path d="M 505 166 L 650 166 L 650 745" fill="none" stroke="#e8871e" stroke-width="3.5"/>
  <path d="M 505 194 L 690 194 L 690 745" fill="none" stroke="#b8860b" stroke-width="3.5"/>
  <text x="560" y="158" font-size="10" fill="#845b00">lightly twist this pair</text>

  <!-- Terminator 1 -->
  <line x1="650" y1="300" x2="690" y2="300" stroke="#555" stroke-width="2"/>
  <rect x="646" y="290" width="48" height="20" fill="#fff" stroke="#666" rx="4"/>
  <text x="670" y="304" font-size="10" text-anchor="middle" fill="#333">120 Ω</text>
  <circle cx="650" cy="300" r="4" fill="#e8871e"/><circle cx="690" cy="300" r="4" fill="#b8860b"/>
  <text x="710" y="296" font-size="10" font-weight="bold" fill="#333">END #1 of the bus</text>
  <text x="710" y="309" font-size="10" fill="#666">may already be built into the transceiver board</text>

  <!-- Motor A -->
  <rect x="330" y="340" width="235" height="95" fill="#f4f0fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="447" y="365" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">RMD-L-5005 · Motor A</text>
  <text x="447" y="380" font-size="10" text-anchor="middle" fill="#556">PAN · 0x141 · JST ZH-6 port</text>
  <g font-size="11" fill="#223"><text x="338" y="404">VCC</text><text x="338" y="426">GND</text></g>
  <g font-size="11" fill="#223" text-anchor="end"><text x="557" y="404">CANH</text><text x="557" y="426">CANL</text></g>
  <line x1="565" y1="400" x2="650" y2="400" stroke="#e8871e" stroke-width="3"/>
  <line x1="565" y1="422" x2="690" y2="422" stroke="#b8860b" stroke-width="3"/>
  <circle cx="650" cy="400" r="4" fill="#e8871e"/><circle cx="690" cy="422" r="4" fill="#b8860b"/>

  <!-- CANable -->
  <rect x="850" y="470" width="300" height="160" fill="#fff6ee" stroke="#c2620a" stroke-width="2" rx="8"/>
  <text x="1000" y="497" font-size="13" font-weight="bold" text-anchor="middle" fill="#7a3d00">USB-CAN sniffer</text>
  <text x="1000" y="513" font-size="10" text-anchor="middle" fill="#96562a">CANable / MKS clone · BoM #10</text>
  <g font-size="11" fill="#223">
    <text x="862" y="538">CANH</text><text x="862" y="560">CANL</text>
    <text x="862" y="582">GND</text><text x="862" y="604" fill="#a00">5V</text>
  </g>
  <text x="900" y="604" font-size="10" fill="#a00" font-weight="bold">← leave EMPTY (it is an output)</text>
  <text x="862" y="624" font-size="10" fill="#7a3d00">USB ────────► your computer</text>

  <!-- CANable taps -->
  <line x1="650" y1="534" x2="850" y2="534" stroke="#e8871e" stroke-width="3"/>
  <line x1="690" y1="556" x2="850" y2="556" stroke="#b8860b" stroke-width="3"/>
  <circle cx="650" cy="534" r="4" fill="#e8871e"/><circle cx="690" cy="556" r="4" fill="#b8860b"/>
  <text x="706" y="502" font-size="10" font-weight="bold" fill="#c2620a">taps MID-SPAN —</text>
  <text x="706" y="515" font-size="10" fill="#c2620a">never at a bus end</text>
  <text x="706" y="578" font-size="10" fill="#c2620a">keep this stub &lt; 30 cm</text>

  <!-- CANable ground -->
  <path d="M 850 578 L 812 578 L 812 800 L 258 800" fill="none" stroke="#222" stroke-width="3"/>
  <text x="850" y="652" font-size="10" font-weight="bold" fill="#222">GND is REQUIRED —</text>
  <text x="850" y="665" font-size="10" fill="#222">"isolated" does not mean "leave it floating"</text>

  <!-- Motor B -->
  <rect x="330" y="620" width="235" height="95" fill="#f4f0fb" stroke="#334" stroke-width="1.5" rx="8" stroke-dasharray="6 3"/>
  <text x="447" y="645" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">RMD-L-5005 · Motor B</text>
  <text x="447" y="660" font-size="10" text-anchor="middle" fill="#556">TILT · 0x142 · joins at stage 6</text>
  <g font-size="11" fill="#223"><text x="338" y="684">VCC</text><text x="338" y="706">GND</text></g>
  <g font-size="11" fill="#223" text-anchor="end"><text x="557" y="684">CANH</text><text x="557" y="706">CANL</text></g>
  <line x1="565" y1="680" x2="650" y2="680" stroke="#e8871e" stroke-width="3"/>
  <line x1="565" y1="702" x2="690" y2="702" stroke="#b8860b" stroke-width="3"/>
  <circle cx="650" cy="680" r="4" fill="#e8871e"/><circle cx="690" cy="702" r="4" fill="#b8860b"/>

  <!-- Terminator 2 -->
  <line x1="650" y1="745" x2="690" y2="745" stroke="#555" stroke-width="2"/>
  <rect x="646" y="735" width="48" height="20" fill="#fff" stroke="#666" rx="4"/>
  <text x="670" y="749" font-size="10" text-anchor="middle" fill="#333">120 Ω</text>
  <circle cx="650" cy="745" r="4" fill="#e8871e"/><circle cx="690" cy="745" r="4" fill="#b8860b"/>
  <text x="630" y="741" font-size="10" font-weight="bold" text-anchor="end" fill="#333">END #2 — at the LAST motor on the bus</text>
  <text x="630" y="754" font-size="10" text-anchor="end" fill="#666">stage 3 that is Motor A · stage 6 it moves to Motor B</text>

  <!-- Bench supply -->
  <rect x="40" y="440" width="175" height="130" fill="#fdf1ee" stroke="#a33" stroke-width="1.5" rx="8"/>
  <text x="127" y="466" font-size="12" font-weight="bold" text-anchor="middle" fill="#622">Bench supply</text>
  <text x="127" y="483" font-size="10" text-anchor="middle" fill="#844">12.0 V · limit 2.0 A</text>
  <g font-size="13" font-weight="bold" text-anchor="end">
    <text x="200" y="518" fill="#d62828">+</text><text x="200" y="548" fill="#222">−</text>
  </g>

  <!-- Motor power -->
  <path d="M 215 514 L 278 514 L 278 400 L 330 400" fill="none" stroke="#d62828" stroke-width="3.5"/>
  <path d="M 278 514 L 278 680 L 330 680" fill="none" stroke="#d62828" stroke-width="3.5"/>
  <path d="M 215 544 L 258 544 L 258 422 L 330 422" fill="none" stroke="#222" stroke-width="3.5"/>
  <path d="M 258 544 L 258 702 L 330 702" fill="none" stroke="#222" stroke-width="3.5"/>

  <!-- Ground star -->
  <path d="M 258 544 L 258 800" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="258" cy="800" r="6" fill="#222"/>
  <path d="M 300 194 L 300 305 L 242 305 L 242 800" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="300" cy="194" r="4" fill="#222"/>
  <text x="330" y="828" font-size="11" font-weight="bold" fill="#222">ONE ground: supply −, both motor grounds, the ESP32's ground and the sniffer's ground all meet at this dot.</text>
  <text x="330" y="845" font-size="10" fill="#666">Skipping it is the number-one cause of "every wire is correct and nothing works."</text>

  <!-- Notes -->
  <rect x="40" y="620" width="190" height="130" fill="#fffbe8" stroke="#c9a227" rx="6"/>
  <text x="52" y="641" font-size="11" font-weight="bold" fill="#6b5200">Before you power up</text>
  <g font-size="10" fill="#514000">
    <text x="52" y="660">· sniffer terminator → OFF</text>
    <text x="52" y="678">· CANH↔CANL reads ~60 Ω</text>
    <text x="52" y="696">· ~40 Ω = three terminators</text>
    <text x="52" y="714">· read the motor's own labels</text>
    <text x="52" y="732">· never plug or unplug live</text>
  </g>
</svg>
