<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#fff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#111">Step 4 · Scale to 7 zones — same pattern, six more times</text>
  <text x="30" y="53" font-size="11" fill="#555">No new ideas here — only repetition and discipline. The map below is the whole step; print it and tape it above the bench.</text>

  <rect x="40" y="80" width="200" height="120" fill="#fdf6ec" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="140" y="102" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">PCA9685 #2 · 0x41 (B2)</text>
  <text x="140" y="122" font-size="9" text-anchor="middle" fill="#8a1c1c" font-weight="bold">bridge the A0 solder jumper</text>
  <text x="140" y="136" font-size="9" text-anchor="middle" fill="#8a1c1c">BEFORE soldering it in → 0x41</text>
  <text x="140" y="156" font-size="9" text-anchor="middle" fill="#555">joins the SAME two I2C wires</text>
  <text x="140" y="170" font-size="9" text-anchor="middle" fill="#555">as board #1 — no new C6 pins</text>
  <text x="140" y="190" font-size="9" text-anchor="middle" fill="#8a6a2f">V+ n/c · VCC = 3V3 · 100 nF</text>

  <rect x="40" y="230" width="200" height="100" fill="#eefaf1" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="140" y="252" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">ULN chips 2 · 3 · 4 (B2)</text>
  <text x="140" y="270" font-size="9" text-anchor="middle" fill="#555">each in its DIP socket</text>
  <text x="140" y="286" font-size="9" text-anchor="middle" fill="#555">each pin 9 → its own wire to star</text>
  <text x="140" y="302" font-size="9" text-anchor="middle" fill="#555">pin 10 always n/c</text>
  <text x="140" y="318" font-size="9" text-anchor="middle" fill="#3f7c55">OUTn is directly across from INn</text>

  <rect x="40" y="360" width="200" height="130" fill="#fdecec" stroke="#c33" rx="6"/>
  <text x="52" y="380" font-size="10" font-weight="bold" fill="#8a1c1c">28-wire discipline</text>
  <g font-size="9" fill="#7c2a2a">
    <text x="52" y="398">· label EVERY tape wire at BOTH</text>
    <text x="52" y="410">  ends, from the pad markings</text>
    <text x="52" y="426">· one JST-XH plug per zone —</text>
    <text x="52" y="438">  four wires: +24, W−, N−, C−</text>
    <text x="52" y="454">· every zone's +24 comes from</text>
    <text x="52" y="466">  the bus, never zone-to-zone</text>
    <text x="52" y="482">· solder in zone order, test as you go</text>
  </g>

  <rect x="290" y="80" width="680" height="410" fill="#fbfbf7" stroke="#888" stroke-width="1.2" rx="8"/>
  <text x="306" y="106" font-size="13" font-weight="bold" fill="#333">The 21-channel map (from Doc 4 stage 4) — W / N / C order per zone</text>
  <g font-size="12" fill="#333">
    <text x="320" y="140" font-weight="bold">Zone</text><text x="420" y="140" font-weight="bold">PCA : channels</text><text x="600" y="140" font-weight="bold">ULN chip : IN pins</text><text x="800" y="140" font-weight="bold">OUT pins → tape</text>
    <text x="320" y="176">1 (radial)</text><text x="420" y="176">#1 : 0 · 1 · 2</text><text x="600" y="176">chip 1 : 1 · 2 · 3</text><text x="800" y="176">18 · 17 · 16</text>
    <text x="320" y="212">2 (radial)</text><text x="420" y="212">#1 : 3 · 4 · 5</text><text x="600" y="212">chip 1 : 4 · 5 · 6</text><text x="800" y="212">15 · 14 · 13</text>
    <text x="320" y="248">3 (radial)</text><text x="420" y="248">#1 : 6 · 7 · 8</text><text x="600" y="248">chip 2 : 1 · 2 · 3</text><text x="800" y="248">18 · 17 · 16</text>
    <text x="320" y="284">4 (radial)</text><text x="420" y="284">#1 : 9 · 10 · 11</text><text x="600" y="284">chip 2 : 4 · 5 · 6</text><text x="800" y="284">15 · 14 · 13</text>
    <text x="320" y="320">5 (radial)</text><text x="420" y="320">#1 : 12 · 13 · 14</text><text x="600" y="320">chip 3 : 1 · 2 · 3</text><text x="800" y="320">18 · 17 · 16</text>
    <text x="320" y="356">6 (radial)</text><text x="420" y="356">#2 : 0 · 1 · 2</text><text x="600" y="356">chip 3 : 4 · 5 · 6</text><text x="800" y="356">15 · 14 · 13</text>
    <text x="320" y="392">7 (ring)</text><text x="420" y="392">#2 : 3 · 4 · 5</text><text x="600" y="392">chip 4 : 1 · 2 · 3</text><text x="800" y="392">18 · 17 · 16</text>
  </g>
  <line x1="310" y1="152" x2="950" y2="152" stroke="#bbb" stroke-width="1"/>
  <text x="306" y="430" font-size="10" fill="#666">Read a row left to right: zone 4's three channels come from PCA #1 channels 9–11, enter ULN chip 2 at pins 4/5/6,</text>
  <text x="306" y="446" font-size="10" fill="#666">and leave from pins 15/14/13 to the zone-4 JST plug — always in warm / neutral / cool order.</text>
  <text x="306" y="472" font-size="10" fill="#8a6a2f">The ESPHome YAML for zones 2–7 already exists from the bench (Doc 4 stage 4) — this step is wiring only.</text>

  <rect x="40" y="530" width="930" height="60" fill="#f2fbf4" stroke="#3f7c55" stroke-width="1.5" rx="8"/>
  <text x="56" y="554" font-size="11" font-weight="bold" fill="#3f7c55">DONE WHEN</text>
  <text x="56" y="572" font-size="10" fill="#2f5c40">Seven independent tunable lights in HA, and the "all zones 2200 K @ 20%" scene runs smoothly — movie mode, now inside a fixture. Mismatched brightness between zones = a ground-star problem, not software.</text>
</svg>
