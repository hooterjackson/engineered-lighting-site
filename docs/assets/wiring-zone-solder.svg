<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#111">Doc 4a · Tape end close-up — cut, label, solder, anchor, then tug</text>
  <text x="30" y="56" font-size="12" fill="#555">Practice on the spool tail first: a lifted pad there costs nothing; on a cut zone it costs one cut-line of tape.</text>

  <rect x="700" y="64" width="270" height="26" fill="#fdecec" stroke="#c33" stroke-width="1.5" rx="13"/>
  <text x="835" y="81" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8a1c1c">POLARITY: YES — one shared +, three −</text>

  <!-- tape strip -->
  <rect x="60" y="140" width="600" height="176" fill="#fff8ec" stroke="#a8792a" stroke-width="2" rx="6"/>
  <text x="360" y="132" font-size="11" font-weight="bold" text-anchor="middle" fill="#6b4c12">Valent X tape · zone end — the four pads sit IN A ROW, on the cut line itself</text>

  <!-- the four pads, bisected by the cut line, letters as PRINTED on the tape -->
  <g fill="#e8c27a" stroke="#8a6a2f" stroke-width="1.5">
    <rect x="98" y="150" width="44" height="30" rx="10"/>
    <rect x="98" y="192" width="44" height="30" rx="10"/>
    <rect x="98" y="234" width="44" height="30" rx="10"/>
    <rect x="98" y="276" width="44" height="30" rx="10"/>
  </g>
  <line x1="120" y1="140" x2="120" y2="316" stroke="#c33" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="66" y="336" font-size="10" font-weight="bold" fill="#8a1c1c">cut ONLY at the printed line — it runs THROUGH the pad centers</text>
  <text x="66" y="350" font-size="9" fill="#7c2a2a">each half-moon becomes a full pad for its side; anywhere else kills both neighbouring segments</text>
  <g font-weight="bold" text-anchor="middle" fill="#5c430e">
    <text x="120" y="169" font-size="9.5">24V+</text>
    <text x="120" y="212" font-size="12">W</text>
    <text x="120" y="254" font-size="12">N</text>
    <text x="120" y="296" font-size="12">C</text>
  </g>
  <text x="480" y="378" font-size="10" fill="#8a6a2f">W = 1800 K warm · N = 3500 K neutral · C = 6500 K cool — as printed on the tape</text>
  <text x="390" y="172" font-size="10" fill="#8a6a2f">← the letters are PRINTED on the tape —</text>
  <text x="390" y="185" font-size="10" fill="#8a6a2f">they are the only authority. Your spool,</text>
  <text x="390" y="198" font-size="10" fill="#8a6a2f">not any diagram (including this one)</text>

  <!-- wires with label flags -->
  <g stroke-width="3" fill="none">
    <path d="M 142 165 C 380 150 540 148 700 150" stroke="#d62828"/>
    <path d="M 142 207 C 400 205 540 202 700 200" stroke="#c47a00"/>
    <path d="M 142 249 C 400 250 540 250 700 250" stroke="#7a7a7a"/>
    <path d="M 142 291 C 400 296 540 300 700 300" stroke="#2e86c1"/>
  </g>
  <g fill="#fff" stroke="#555" stroke-width="1">
    <rect x="700" y="140" width="66" height="20" rx="3"/>
    <rect x="700" y="190" width="66" height="20" rx="3"/>
    <rect x="700" y="240" width="66" height="20" rx="3"/>
    <rect x="700" y="290" width="66" height="20" rx="3"/>
  </g>
  <g font-size="9.5" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="733" y="154">"24V+"</text>
    <text x="733" y="204">"W −"</text>
    <text x="733" y="254">"N −"</text>
    <text x="733" y="304">"C −"</text>
  </g>
  <text x="790" y="188" font-size="9" fill="#555">label flags at BOTH ends,</text>
  <text x="790" y="202" font-size="9" fill="#555">copied letter-for-letter from</text>
  <text x="790" y="216" font-size="9" fill="#555">the pad print — never from</text>
  <text x="790" y="230" font-size="9" fill="#555">wire colour, never from memory</text>

  <!-- strain relief anchor -->
  <rect x="330" y="150" width="26" height="166" fill="#d9e6d9" fill-opacity="0.7" stroke="#3f7c55" stroke-width="2" rx="4"/>
  <text x="343" y="384" font-size="10" font-weight="bold" text-anchor="middle" fill="#2a5c3a">ANCHOR</text>
  <line x1="343" y1="320" x2="343" y2="372" stroke="#3f7c55" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="343" y="400" font-size="9" text-anchor="middle" fill="#2a5c3a">within ~20 mm of the pads, BEFORE the</text>
  <text x="343" y="413" font-size="9" text-anchor="middle" fill="#2a5c3a">tug test — a tug lands here, never on a joint</text>

  <!-- solder order -->
  <rect x="60" y="430" width="380" height="96" fill="#f2fbf4" stroke="#3f7c55" stroke-width="1.5" rx="8"/>
  <text x="76" y="452" font-size="11" font-weight="bold" fill="#3f7c55">SOLDER ORDER (Doc 8's volcano rule)</text>
  <g font-size="10" fill="#2f5c40">
    <text x="76" y="472">1 · tin the pad    2 · tin the wire</text>
    <text x="76" y="488">3 · touch them together with the iron — 2 s, done</text>
    <text x="76" y="504">4 · a tiny volcano = good · a blobby ball = redo with flux</text>
    <text x="76" y="520">then CP9–CP11: beep every wire to its own pad only</text>
  </g>

  <!-- wire gauge trap -->
  <rect x="60" y="542" width="380" height="76" fill="#fdecec" stroke="#c33" rx="6"/>
  <text x="76" y="564" font-size="10" font-weight="bold" fill="#8a1c1c">24–26 AWG SILICONE STRANDED ONLY</text>
  <text x="76" y="582" font-size="9.5" fill="#7c2a2a">22 AWG solid is the canonical lifted-pad cause:</text>
  <text x="76" y="596" font-size="9.5" fill="#7c2a2a">a stiff wire works as a lever, and every nudge pries</text>
  <text x="76" y="610" font-size="9.5" fill="#7c2a2a">at a pad held on by adhesive and hope</text>

  <!-- the swap nothing can catch -->
  <rect x="60" y="632" width="380" height="58" fill="#fdecec" stroke="#c33" stroke-width="2" rx="6"/>
  <text x="76" y="652" font-size="10" font-weight="bold" fill="#8a1c1c">THE ONE MISTAKE NOTHING CAN CATCH</text>
  <text x="76" y="668" font-size="9.5" fill="#7c2a2a">Swap W and C and every checkpoint still passes — the zone lights,</text>
  <text x="76" y="682" font-size="9.5" fill="#7c2a2a">all green. Warm and cool live only in YOUR flags. Copy the print.</text>

  <!-- meter note -->
  <rect x="480" y="440" width="200" height="140" fill="#fffbe8" stroke="#c9a227" rx="6"/>
  <text x="492" y="460" font-size="10" font-weight="bold" fill="#6b5200">THE METER CANNOT</text>
  <text x="492" y="474" font-size="10" font-weight="bold" fill="#6b5200">SEE THROUGH LEDs</text>
  <g font-size="9" fill="#514000">
    <text x="492" y="492">pad-to-pad reads OL on a good</text>
    <text x="492" y="505">harness AND a reversed one.</text>
    <text x="492" y="522">polarity = the pad print, plus</text>
    <text x="492" y="535">first power with + and ONE</text>
    <text x="492" y="548">channel landed — a reversal</text>
    <text x="492" y="561">simply lights nothing</text>
  </g>

  <!-- stray strand inset -->
  <circle cx="800" cy="490" r="95" fill="#fff" stroke="#555" stroke-width="2"/>
  <line x1="737" y1="419" x2="690" y2="380" stroke="#555" stroke-width="2"/>
  <g fill="#e8c27a" stroke="#8a6a2f" stroke-width="1.5">
    <rect x="742" y="450" width="52" height="30" rx="3"/>
    <rect x="742" y="500" width="52" height="30" rx="3"/>
  </g>
  <path d="M 750 478 C 762 488 774 492 786 502" fill="none" stroke="#c33" stroke-width="1.6"/>
  <path d="M 794 465 C 830 458 850 470 856 482" fill="none" stroke="#c47a00" stroke-width="3"/>
  <path d="M 794 515 C 832 510 852 518 858 528" fill="none" stroke="#2e86c1" stroke-width="3"/>
  <text x="800" y="602" font-size="10" font-weight="bold" text-anchor="middle" fill="#8a1c1c">one stray strand bridging pads = CP9 fails</text>
  <text x="800" y="616" font-size="9.5" text-anchor="middle" fill="#7c2a2a">reflow, re-beep — never shrug it off</text>
</svg>
