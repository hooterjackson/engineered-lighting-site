<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#fff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#111">Step 2 · The brain — socket the C6, give it 5 V and one ground</text>
  <text x="30" y="53" font-size="11" fill="#555">Board 3 starts here. Solder female pin-header sockets first; the C6 presses in and can always press back out.</text>

  <rect x="240" y="90" width="520" height="300" fill="none" stroke="#5577aa" stroke-width="1.2" stroke-dasharray="7 5" rx="10"/>
  <text x="252" y="110" font-size="11" font-weight="bold" fill="#5577aa">BOARD 3 · LOGIC (bottom of the stack — USB + antenna stay reachable)</text>

  <rect x="360" y="140" width="280" height="200" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <rect x="372" y="152" width="256" height="176" fill="none" stroke="#5577aa" stroke-width="1" stroke-dasharray="3 3" rx="5"/>
  <text x="500" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="#223">ESP32-C6 DevKitC-1</text>
  <text x="500" y="196" font-size="9" text-anchor="middle" fill="#5577aa">dashed line = the female socket it presses into</text>
  <g font-size="10" fill="#223">
    <text x="380" y="230">5V pin</text>
    <text x="380" y="260">GND pin</text>
    <text x="620" y="230" text-anchor="end">USB-C port faces a</text>
    <text x="620" y="244" text-anchor="end">reachable edge —</text>
    <text x="620" y="258" text-anchor="end">it's your recovery path</text>
  </g>
  <text x="500" y="316" font-size="9" text-anchor="middle" fill="#8a6a2f">100 nF ceramic across 5V→GND right at the socket pins</text>

  <path d="M 120 226 L 360 226" fill="none" stroke="#c2185b" stroke-width="3"/>
  <text x="126" y="216" font-size="9" fill="#c2185b">5 V from the step-1 buck</text>
  <path d="M 120 256 L 240 256 L 240 470 L 500 470" fill="none" stroke="#222" stroke-width="3"/>
  <line x1="420" y1="470" x2="760" y2="470" stroke="#222" stroke-width="6"/>
  <text x="480" y="492" font-size="10" font-weight="bold" fill="#111">GND STAR (Board 1, from step 1)</text>
  <path d="M 360 256 L 320 256 L 320 300" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M 320 300 L 240 300" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="248" y="320" font-size="8.5" fill="#333">the SN65's ground joins</text>
  <text x="248" y="332" font-size="8.5" fill="#333">this ONE Board-3 return — never its own path</text>

  <rect x="700" y="120" width="270" height="150" fill="#fdecec" stroke="#c33" rx="6"/>
  <text x="712" y="140" font-size="10" font-weight="bold" fill="#8a1c1c">The dual-power trap</text>
  <g font-size="9" fill="#7c2a2a">
    <text x="712" y="158">First flash happens over USB-C —</text>
    <text x="712" y="172">and while USB is plugged in, the</text>
    <text x="712" y="186">stack's 24 V stays OFF. Never feed</text>
    <text x="712" y="200">the C6 from both sides at once.</text>
    <text x="712" y="222">After that first flash, every update</text>
    <text x="712" y="236">is wireless (OTA) — the USB port</text>
    <text x="712" y="250">is for emergencies only.</text>
  </g>

  <rect x="40" y="530" width="930" height="60" fill="#f2fbf4" stroke="#3f7c55" stroke-width="1.5" rx="8"/>
  <text x="56" y="554" font-size="11" font-weight="bold" fill="#3f7c55">DONE WHEN</text>
  <text x="56" y="572" font-size="10" fill="#2f5c40">The C6 boots from stack power alone (USB unplugged) and shows up in ESPHome/Home Assistant — the fixture-bench.yaml from Doc 4 already knows this chip.</text>
</svg>
