<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#111">Doc 8 · The five 100 nF — a small tank at every module</text>
  <text x="30" y="57" font-size="12" fill="#555">The placement IS the part: across each module's supply pin and ground, a centimetre away at most, legs short.</text>

  <!-- cap glyph legend -->
  <circle cx="712" cy="84" r="13" fill="#e8a86a" stroke="#8a5a2a" stroke-width="1.5"/>
  <text x="712" y="87" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#4a2f10">104</text>
  <line x1="705" y1="95" x2="705" y2="103" stroke="#8a5a2a" stroke-width="2"/>
  <line x1="719" y1="95" x2="719" y2="103" stroke="#8a5a2a" stroke-width="2"/>
  <text x="734" y="82" font-size="9.5" fill="#555">= one 100 nF — the kit value whose body reads <tspan font-weight="bold">104</tspan></text>
  <text x="734" y="99" font-size="9.5" font-weight="bold" fill="#3f7c55">POLARITY: NONE — either leg, either pin</text>

  <!-- B1 -->
  <rect x="40" y="110" width="620" height="180" fill="#fbf6ee" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="56" y="134" font-size="12.5" font-weight="bold" fill="#223">B1 · POWER</text>
  <rect x="90" y="158" width="190" height="100" fill="#eefaf1" stroke="#334" stroke-width="1.2" rx="6"/>
  <text x="185" y="182" font-size="11" font-weight="bold" text-anchor="middle" fill="#223">Pololu buck (socketed)</text>
  <g font-size="9" fill="#556" text-anchor="middle"><text x="185" y="198">24 V in → 5 V out</text></g>
  <text x="140" y="242" font-size="9.5" fill="#223">VIN</text>
  <text x="216" y="242" font-size="9.5" fill="#223">GND</text>
  <circle cx="178" cy="238" r="9" fill="#e8a86a" stroke="#8a5a2a" stroke-width="1.5"/>
  <line x1="172" y1="246" x2="164" y2="250" stroke="#8a5a2a" stroke-width="2"/>
  <line x1="184" y1="246" x2="192" y2="250" stroke="#8a5a2a" stroke-width="2"/>
  <ellipse cx="180" cy="242" rx="52" ry="22" fill="none" stroke="#3f7c55" stroke-width="3"/>
  <line x1="232" y1="240" x2="268" y2="228" stroke="#3f7c55" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="274" y="230" font-size="9" fill="#3f7c55" font-weight="bold">≤ 1 cm from the pins</text>

  <rect x="380" y="158" width="230" height="100" fill="#fdf1f0" stroke="#a33" stroke-width="1.2" rx="6"/>
  <text x="495" y="182" font-size="11" font-weight="bold" text-anchor="middle" fill="#223">PicoBuck (socketed)</text>
  <g font-size="9" fill="#556" text-anchor="middle">
    <text x="495" y="200">already tanked — it carries its own</text>
    <text x="495" y="214">capacitors on-board (schematic: 2.2 µF/ch)</text>
    <text x="495" y="234" font-weight="bold" fill="#3f7c55">no 100 nF needed here</text>
  </g>

  <!-- B2 -->
  <rect x="40" y="316" width="620" height="180" fill="#fbf6ee" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="56" y="340" font-size="12.5" font-weight="bold" fill="#223">B2 · DRIVERS</text>
  <rect x="90" y="364" width="200" height="100" fill="#fdf6ec" stroke="#334" stroke-width="1.2" rx="6"/>
  <text x="190" y="388" font-size="11" font-weight="bold" text-anchor="middle" fill="#223">PCA9685 #1 (socketed)</text>
  <text x="140" y="448" font-size="9.5" fill="#223">VCC</text>
  <text x="226" y="448" font-size="9.5" fill="#223">GND</text>
  <circle cx="184" cy="444" r="9" fill="#e8a86a" stroke="#8a5a2a" stroke-width="1.5"/>
  <line x1="178" y1="452" x2="170" y2="456" stroke="#8a5a2a" stroke-width="2"/>
  <line x1="190" y1="452" x2="198" y2="456" stroke="#8a5a2a" stroke-width="2"/>
  <ellipse cx="186" cy="448" rx="54" ry="22" fill="none" stroke="#3f7c55" stroke-width="3"/>

  <rect x="330" y="364" width="200" height="100" fill="#fdf6ec" stroke="#334" stroke-width="1.2" rx="6"/>
  <text x="430" y="388" font-size="11" font-weight="bold" text-anchor="middle" fill="#223">PCA9685 #2 (socketed)</text>
  <text x="380" y="448" font-size="9.5" fill="#223">VCC</text>
  <text x="466" y="448" font-size="9.5" fill="#223">GND</text>
  <circle cx="424" cy="444" r="9" fill="#e8a86a" stroke="#8a5a2a" stroke-width="1.5"/>
  <line x1="418" y1="452" x2="410" y2="456" stroke="#8a5a2a" stroke-width="2"/>
  <line x1="430" y1="452" x2="438" y2="456" stroke="#8a5a2a" stroke-width="2"/>
  <ellipse cx="426" cy="448" rx="54" ry="22" fill="none" stroke="#3f7c55" stroke-width="3"/>

  <text x="556" y="410" font-size="9" fill="#8a8a8a">the four ULNs have no</text>
  <text x="556" y="424" font-size="9" fill="#8a8a8a">supply pin — no cap</text>

  <!-- B3 -->
  <rect x="40" y="522" width="620" height="180" fill="#fbf6ee" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="56" y="546" font-size="12.5" font-weight="bold" fill="#223">B3 · LOGIC</text>
  <rect x="90" y="570" width="200" height="100" fill="#eef3fb" stroke="#334" stroke-width="1.2" rx="6"/>
  <text x="190" y="594" font-size="11" font-weight="bold" text-anchor="middle" fill="#223">C6 socket</text>
  <text x="142" y="654" font-size="9.5" fill="#223">5 V</text>
  <text x="226" y="654" font-size="9.5" fill="#223">GND</text>
  <circle cx="184" cy="650" r="9" fill="#e8a86a" stroke="#8a5a2a" stroke-width="1.5"/>
  <line x1="178" y1="658" x2="170" y2="662" stroke="#8a5a2a" stroke-width="2"/>
  <line x1="190" y1="658" x2="198" y2="662" stroke="#8a5a2a" stroke-width="2"/>
  <ellipse cx="186" cy="654" rx="52" ry="22" fill="none" stroke="#3f7c55" stroke-width="3"/>

  <rect x="330" y="570" width="200" height="100" fill="#eef3fb" stroke="#334" stroke-width="1.2" rx="6"/>
  <text x="430" y="594" font-size="11" font-weight="bold" text-anchor="middle" fill="#223">CAN board (SN65)</text>
  <text x="380" y="654" font-size="9.5" fill="#223">3V3</text>
  <text x="466" y="654" font-size="9.5" fill="#223">GND</text>
  <circle cx="424" cy="650" r="9" fill="#e8a86a" stroke="#8a5a2a" stroke-width="1.5"/>
  <line x1="418" y1="658" x2="410" y2="662" stroke="#8a5a2a" stroke-width="2"/>
  <line x1="430" y1="658" x2="438" y2="662" stroke="#8a5a2a" stroke-width="2"/>
  <ellipse cx="426" cy="654" rx="52" ry="22" fill="none" stroke="#3f7c55" stroke-width="3"/>

  <!-- right column notes -->
  <rect x="690" y="110" width="270" height="150" fill="#fbfbf7" stroke="#888" stroke-width="1.2" rx="6"/>
  <text x="702" y="131" font-size="10" font-weight="bold" fill="#333">ONE WATER MAIN, FIVE HOUSES</text>
  <g font-size="9.5" fill="#444">
    <text x="702" y="150">The soldered trunks are one long pipe</text>
    <text x="702" y="165">from the street. Chips drink in millions</text>
    <text x="702" y="180">of tiny fast sips the pipe can't answer</text>
    <text x="702" y="195">in time. Each cap is a small tank at</text>
    <text x="702" y="210">its own house, covering the sips.</text>
    <text x="702" y="230">The breadboard never needed them —</text>
    <text x="702" y="245">everything sat an inch apart.</text>
  </g>

  <rect x="690" y="280" width="270" height="180" fill="#fdecec" stroke="#c33" rx="6"/>
  <text x="702" y="301" font-size="10" font-weight="bold" fill="#8a1c1c">AT THE PINS, NOT ON THE RAIL</text>
  <g font-size="9.5" fill="#7c2a2a">
    <text x="702" y="320">A tank down the street is no tank.</text>
    <text x="702" y="335">Skipping these buys the worst bug on</text>
    <text x="702" y="350">the bench: occasional glitches and</text>
    <text x="702" y="365">resets that look exactly like software.</text>
  </g>
  <g font-size="9.5" font-weight="bold">
    <text x="702" y="392" fill="#3f7c55">RIGHT — legs short, at the pin + GND</text>
    <text x="702" y="412" fill="#8a1c1c">WRONG — anywhere along the trunk</text>
    <text x="702" y="432" fill="#8a1c1c">WRONG — shared by two modules</text>
  </g>

  <rect x="690" y="480" width="270" height="140" fill="#fffbe8" stroke="#c9a227" rx="6"/>
  <text x="702" y="501" font-size="10" font-weight="bold" fill="#6b5200">SOLDERING NOTES</text>
  <g font-size="9.5" fill="#514000">
    <text x="702" y="520">· Body code 104 = 100 nF. No polarity.</text>
    <text x="702" y="535">· Five used: buck, PCA #1, PCA #2,</text>
    <text x="702" y="550">  C6 socket, CAN board.</text>
    <text x="702" y="565">· The other ~5 in the bag are spares.</text>
    <text x="702" y="580">· Steps 2 and 3 each place one as</text>
    <text x="702" y="595">  they build — this map is the total.</text>
  </g>
</svg>
