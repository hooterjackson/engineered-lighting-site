"1.1" text-anchor="middle" font-family="Arial">30 mm tip to unchanged launches</text></g><text x="90" y="22" font-size="1.25" text-anchor="start" font-family="Arial">Mating to Molex 2005280300 on main J2.</text><text x="90" y="26" font-size="1.25" text-anchor="start" font-family="Arial">Main J2 faces LEFT; insertion is toward main-board centre.</text><text x="90" y="30" font-size="1.25" text-anchor="start" font-family="Arial">F-side / support view, tip up: PIN 1 LEFT.</text><text x="90" y="34" font-size="1.25" text-anchor="start" font-family="Arial">Exposed gold-face view, tip up: PIN 1 RIGHT.</text><text x="90" y="38" font-size="1.25" text-anchor="start" font-family="Arial">Width: 31 +0.10 / -0.05. Pitch: 1.00 +/-0.05.</text><text x="90" y="42" font-size="1.25" text-anchor="start" font-family="Arial">First-last centre span: 29.00 +/-0.05 (noncumulative).</text><text x="90" y="46" font-size="1.25" text-anchor="start" font-family="Arial">Finger width: 0.55 +/-0.05; exposure: 3.5 +/-0.3.</text><text x="90" y="50" font-size="1.25" text-anchor="start" font-family="Arial">End contact centres: 1.0 +/-0.15 from side edges.</text><text x="90" y="54" font-size="1.25" text-anchor="start" font-family="Arial">Leading corners: 2 x R0.3 +/-0.2; no copper intersection.</text><text x="90" y="58" font-size="1.25" text-anchor="start" font-family="Arial">Front stiffener: tip to6.0 +/-0.25; drawing minimum5.0.</text><text x="90" y="62" font-size="1.25" text-anchor="start" font-family="Arial">TOTAL insertion thickness: 0.30 +/-0.05, all layers included.</text><text x="90" y="66" font-size="1.25" text-anchor="start" font-family="Arial">Finger Au &gt;=0.10 um over Ni1–5 um. No solder on fingers.</text><text x="90" y="70" font-size="1.25" text-anchor="start" font-family="Arial">Six pin groups: Z4 / Z5 / Z6 / Z1 / Z2 / Z3.</text><text x="90" y="74" font-size="1.25" text-anchor="start" font-family="Arial">Each group is +,+,W,N,C. Positive pairs stay zone-isolated.</text><text x="90" y="78" font-size="1.25" text-anchor="start" font-family="Arial">23 mm extension beyond v0.2. Actual enclosure reach unverified.</text><text x="90" y="82" font-size="1.25" text-anchor="start" font-family="Arial">Strain-relieve to enclosure; no bend in supported insertion.</text><text x="90" y="86" font-size="1.25" text-anchor="start" font-family="Arial">Connector is installed on main PCB, not this passive flex.</text><text x="90" y="90" font-size="1.25" text-anchor="start" font-family="Arial">Drawing shown 2:1. Use template-1-to-1.svg for fit printing.</text><text x="7" y="103" font-size="1.6" text-anchor="start" font-family="Arial">Fabrication review required: actual two-layer flex stack, finger plating, dimensional control and registration.</text><text x="7" y="109" font-size="1.6" text-anchor="start" font-family="Arial">No powered mating. Real strip end-to-end continuity, cylinder fit and loaded temperatures remain unmeasured.</text></svg>