<svg viewBox="0 0 1560 990" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#556"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1560" height="990" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#111">Fixture v0 · the wiring map — read one lane at a time</text>
  <text x="30" y="56" font-size="12" fill="#555">This page is the overview: what connects to what, and how many wires each connection really is. Pin-level detail lives in the six step diagrams — build in step order 1 → 6.</text>

  <!-- legend -->
  <g font-size="10" fill="#333">
    <text x="1240" y="30" font-weight="bold" font-size="11">How to read this</text>
    <line x1="1240" y1="42" x2="1280" y2="42" stroke="#d62828" stroke-width="4"/><text x="1286" y="46">+24 V power</text>
    <line x1="1240" y1="58" x2="1280" y2="58" stroke="#222" stroke-width="4"/><text x="1286" y="62">ground (GND)</text>
    <line x1="1240" y1="74" x2="1280" y2="74" stroke="#c2185b" stroke-width="3"/><text x="1286" y="78">5 V logic feed</text>
    <line x1="1240" y1="90" x2="1274" y2="90" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/><text x="1286" y="94">signal group — label says how many wires</text>
    <text x="1240" y="112" fill="#666" font-size="9">B1/B2/B3 on a block = which board (side view, bottom left):</text>
    <text x="1240" y="125" fill="#666" font-size="9">B1 power · B2 drivers · B3 logic — allocation chosen so only</text>
    <text x="1240" y="137" fill="#666" font-size="9">~a dozen wires ever run between boards</text>
  </g>

  <!-- ============ STEP 1 · POWER (body + trunks) ============ -->
  <rect x="24" y="84" width="200" height="272" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="7 5" rx="10"/>
  <text x="34" y="102" font-size="11" font-weight="bold" fill="#777">STEP 1 · FIXTURE BODY</text>

  <rect x="40" y="112" width="168" height="56" fill="#f3f3f3" stroke="#666" stroke-width="1.5" rx="8"/>
  <text x="124" y="134" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">E26 socket-to-wire</text>
  <text x="124" y="150" font-size="9" text-anchor="middle" fill="#555">120 VAC · both leads = live</text>

  <rect x="40" y="196" width="168" height="92" fill="#ffe9e6" stroke="#d62828" stroke-width="2" rx="8"/>
  <text x="124" y="218" font-size="12" font-weight="bold" text-anchor="middle" fill="#8a1c1c">IRM-90-24ST</text>
  <text x="124" y="233" font-size="9" text-anchor="middle" fill="#8a1c1c">24 V · 90 W · potted · fanless</text>
  <text x="124" y="248" font-size="9" text-anchor="middle" fill="#8a6a2f">screw terminals · body-mounted</text>
  <g font-size="10" fill="#223">
    <text x="196" y="270" text-anchor="end">+V  −V</text>
  </g>

  <line x1="100" y1="168" x2="100" y2="196" stroke="#555" stroke-width="3"/>
  <line x1="148" y1="168" x2="148" y2="196" stroke="#999" stroke-width="3"/>

  <text x="30" y="372" font-size="8" fill="#7c2a2a">heat-shrink every AC terminal · strain-relief at entry</text>
  <text x="30" y="384" font-size="8" fill="#7c2a2a">Class II module — 2-wire feed, no earth needed</text>
  <text x="30" y="396" font-size="8" fill="#7c2a2a">no wall dimmer on this socket's circuit</text>

  <!-- +V -> fuse -> bench feed -> down to trunk -->
  <path d="M 160 288 L 160 302" fill="none" stroke="#d62828" stroke-width="4"/>
  <rect x="140" y="302" width="40" height="16" fill="#fff" stroke="#8a1c1c" stroke-width="1.5" rx="4"/>
  <text x="160" y="314" font-size="8.5" text-anchor="middle" fill="#8a1c1c">3A SB</text>
  <path d="M 160 318 L 160 360 L 292 360 L 292 820" fill="none" stroke="#d62828" stroke-width="4"/>
  <line x1="236" y1="352" x2="244" y2="368" stroke="#ffffff" stroke-width="5"/>
  <line x1="236" y1="352" x2="244" y2="368" stroke="#8a1c1c" stroke-width="1.5"/>
  <line x1="242" y1="352" x2="250" y2="368" stroke="#8a1c1c" stroke-width="1.5"/>
  <text x="243" y="382" font-size="8" text-anchor="middle" fill="#8a1c1c">bench feed (XT30)</text>
  <!-- -V down to gnd trunk -->
  <path d="M 188 288 L 188 340 L 316 340 L 316 852" fill="none" stroke="#222" stroke-width="4"/>

  <!-- trunks -->
  <line x1="292" y1="820" x2="1505" y2="820" stroke="#d62828" stroke-width="6"/>
  <text x="340" y="812" font-size="11" font-weight="bold" fill="#8a1c1c">+24 V TRUNK — tinned 16–18 AWG bus wire (B1) · every load drinks from here</text>
  <line x1="316" y1="852" x2="1470" y2="852" stroke="#222" stroke-width="6"/>
  <circle cx="316" cy="852" r="5" fill="#222"/>
  <text x="340" y="874" font-size="11" font-weight="bold" fill="#111">GND TRUNK — single star point (B1) · every return comes straight here, nothing daisy-chained</text>

  <!-- buck -->
  <rect x="300" y="690" width="160" height="76" fill="#e8f4fd" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="380" y="712" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">Pololu buck · B1</text>
  <text x="380" y="727" font-size="9" text-anchor="middle" fill="#555">24 V → 5 V · 2.5 A</text>
  <text x="380" y="742" font-size="9" text-anchor="middle" fill="#555">feeds the brain only</text>
  <path d="M 330 820 L 330 766" fill="none" stroke="#d62828" stroke-width="3"/><circle cx="330" cy="820" r="4" fill="#d62828"/>
  <path d="M 370 766 L 370 852" fill="none" stroke="#222" stroke-width="3"/><circle cx="370" cy="852" r="4" fill="#222"/>
  <path d="M 460 714 L 482 714 L 482 300 L 520 300" fill="none" stroke="#c2185b" stroke-width="3"/>
  <text x="470" y="640" font-size="9" fill="#c2185b" transform="rotate(-90 470 640)">5 V up to the C6</text>

  <!-- ============ STEP 2 · THE BRAIN ============ -->
  <rect x="520" y="170" width="120" height="610" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="10"/>
  <text x="580" y="196" font-size="13" font-weight="bold" text-anchor="middle" fill="#223">ESP32-C6</text>
  <text x="580" y="211" font-size="9" text-anchor="middle" fill="#555">DevKitC-1 · B3 · socketed</text>
  <text x="580" y="226" font-size="9" text-anchor="middle" fill="#555">STEP 2 · one chip runs it all</text>
  <g font-size="9" fill="#223">
    <text x="526" y="303">5V in</text>
    <text x="526" y="333">GND</text>
  </g>
  <g font-size="9" fill="#223" text-anchor="end">
    <text x="634" y="253">GPIO2 · SDA</text>
    <text x="634" y="273">GPIO3 · SCL</text>
    <text x="634" y="463">GPIO10</text>
    <text x="634" y="483">GPIO11</text>
    <text x="634" y="503">GPIO18</text>
    <text x="634" y="653">GPIO6 · TX</text>
    <text x="634" y="673">GPIO7 · RX</text>
  </g>
  <path d="M 520 330 L 500 330 L 500 852" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="500" cy="852" r="4" fill="#222"/>
  <text x="524" y="798" font-size="9" fill="#334">pins used: 2 + 3 + 2 = 7 signals</text>

  <!-- ============ LANE 1 · TAPE ============ -->
  <rect x="660" y="150" width="880" height="216" fill="#fffaf0" stroke="none" rx="10"/>
  <text x="672" y="170" font-size="11" font-weight="bold" fill="#a8792a">LANE 1 · THE TAPE — 7 zones, each with its own brightness + color temp (steps 3 + 4)</text>

  <rect x="690" y="204" width="210" height="96" fill="#fdf6ec" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="795" y="224" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">PCA9685 ×2 · B2 (drivers)</text>
  <text x="795" y="240" font-size="9" text-anchor="middle" fill="#555">the PWM factories — 21 of 32 ch used</text>
  <text x="795" y="254" font-size="9" text-anchor="middle" fill="#555">I2C addresses 0x40 + 0x41 (A0 bridged)</text>
  <text x="795" y="272" font-size="9" text-anchor="middle" fill="#8a6a2f">VCC = 3V3, never 5 V · V+ stays n/c</text>

  <rect x="990" y="204" width="180" height="96" fill="#eefaf1" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="1080" y="224" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">ULN2803A ×4 · B2</text>
  <text x="1080" y="240" font-size="9" text-anchor="middle" fill="#555">the muscle — 8 switches per chip</text>
  <text x="1080" y="254" font-size="9" text-anchor="middle" fill="#555">let 3.3 V signals switch 24 V tape</text>
  <text x="1080" y="272" font-size="9" text-anchor="middle" fill="#3f7c55">each p9 → star · COM n/c</text>

  <rect x="1260" y="190" width="250" height="140" fill="#fff8ec" stroke="#a8792a" stroke-width="1.5" rx="8"/>
  <text x="1385" y="212" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b4c12">VALENT X — 7 ZONES</text>
  <text x="1385" y="230" font-size="9" text-anchor="middle" fill="#6b4c12">each zone: one +24 V feed (common anode)</text>
  <text x="1385" y="244" font-size="9" text-anchor="middle" fill="#6b4c12">+ three switched returns (1800/3500/6500 K)</text>
  <text x="1385" y="258" font-size="9" text-anchor="middle" fill="#6b4c12">JST-XH plug per zone · 28 wires total</text>
  <text x="1385" y="276" font-size="9" text-anchor="middle" fill="#8a6a2f">label every wire from the tape's</text>
  <text x="1385" y="288" font-size="9" text-anchor="middle" fill="#8a6a2f">printed pad markings</text>

  <line x1="640" y1="252" x2="686" y2="252" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="663" y="243" font-size="8.5" text-anchor="middle" fill="#556">2 wires · I2C</text>
  <line x1="900" y1="252" x2="986" y2="252" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="943" y="243" font-size="8.5" text-anchor="middle" fill="#556">21 dim signals (3.3 V)</text>
  <line x1="1170" y1="252" x2="1256" y2="252" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1213" y="243" font-size="8.5" text-anchor="middle" fill="#556">21 returns (24 V)</text>

  <path d="M 1500 820 L 1500 330" fill="none" stroke="#d62828" stroke-width="3.5"/>
  <circle cx="1500" cy="820" r="4" fill="#d62828"/>
  <text x="1494" y="560" font-size="9" fill="#8a1c1c" transform="rotate(-90 1494 560)">+24 V — one feed per zone (×7)</text>
  <path d="M 1080 300 L 1080 322 L 930 322 L 930 852" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="930" cy="852" r="4" fill="#222"/>
  <text x="922" y="560" font-size="9" fill="#333" transform="rotate(-90 922 560)">ULN p9 ×4 → star</text>

  <!-- ============ LANE 2 · SPOTLIGHT ============ -->
  <rect x="660" y="400" width="880" height="170" fill="#fdf4f8" stroke="none" rx="10"/>
  <text x="672" y="420" font-size="11" font-weight="bold" fill="#8a3a5c">LANE 2 · THE SPOTLIGHT — 3 LEDs, each individually drivable (step 5)</text>

  <rect x="690" y="440" width="210" height="100" fill="#fdf0f5" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="795" y="460" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">PicoBuck · B1 (power)</text>
  <text x="795" y="476" font-size="9" text-anchor="middle" fill="#555">3 constant-current channels @ 330 mA</text>
  <text x="795" y="494" font-size="9" text-anchor="middle" fill="#8a1c1c">3× 10 kΩ pulldowns on IN1–3 —</text>
  <text x="795" y="506" font-size="9" text-anchor="middle" fill="#8a1c1c">floating inputs = FULL ON at boot</text>
  <text x="795" y="524" font-size="9" text-anchor="middle" fill="#555">VIN/GND from the trunks below</text>

  <rect x="1260" y="440" width="250" height="100" fill="#fdf0e6" stroke="#a8792a" stroke-width="1.5" rx="8"/>
  <text x="1385" y="462" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b4c12">CREE 3-UP STAR + OPTIC</text>
  <text x="1385" y="478" font-size="9" text-anchor="middle" fill="#6b4c12">3 dies, individually addressable</text>
  <text x="1385" y="492" font-size="9" text-anchor="middle" fill="#6b4c12">check printed polarity per die</text>
  <text x="1385" y="510" font-size="9" text-anchor="middle" fill="#8a6a2f">always on its heatsink · the shell</text>
  <text x="1385" y="522" font-size="9" text-anchor="middle" fill="#8a6a2f">must give it an air path</text>

  <line x1="640" y1="482" x2="686" y2="482" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="663" y="473" font-size="8.5" text-anchor="middle" fill="#556">3 PWM wires</text>
  <line x1="900" y1="490" x2="1256" y2="490" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1078" y="481" font-size="8.5" text-anchor="middle" fill="#556">3 constant-current pairs (one ± per die)</text>

  <path d="M 888 540 L 888 820" fill="none" stroke="#d62828" stroke-width="3"/>
  <circle cx="888" cy="820" r="4" fill="#d62828"/>
  <path d="M 897 540 L 897 852" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="897" cy="852" r="4" fill="#222"/>

  <!-- ============ LANE 3 · GIMBAL ============ -->
  <rect x="660" y="600" width="880" height="192" fill="#f2f6fc" stroke="none" rx="10"/>
  <text x="672" y="620" font-size="11" font-weight="bold" fill="#33538a">LANE 3 · THE GIMBAL — 2 smart motors on one 2-wire bus (step 6)</text>

  <rect x="690" y="640" width="190" height="100" fill="#f2ecfa" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="785" y="660" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">SN65HVD230 · B3</text>
  <text x="785" y="676" font-size="9" text-anchor="middle" fill="#555">CAN transceiver — the chip's voice</text>
  <text x="785" y="694" font-size="9" text-anchor="middle" fill="#8a6a2f">onboard 120 Ω = near-end</text>
  <text x="785" y="706" font-size="9" text-anchor="middle" fill="#8a6a2f">termination</text>

  <rect x="990" y="640" width="190" height="110" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="1085" y="662" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">RMD-L-5005 · PAN</text>
  <text x="1085" y="678" font-size="9" text-anchor="middle" fill="#555">address 0x141</text>
  <text x="1085" y="694" font-size="9" text-anchor="middle" fill="#555">motion math happens inside</text>
  <text x="1085" y="712" font-size="9" text-anchor="middle" fill="#8a1c1c">power = XT30 pair from trunks</text>

  <rect x="1290" y="640" width="190" height="110" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="1385" y="662" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">RMD-L-5005 · TILT</text>
  <text x="1385" y="678" font-size="9" text-anchor="middle" fill="#555">address 0x142</text>
  <text x="1385" y="694" font-size="9" text-anchor="middle" fill="#8a1c1c">+ 120 Ω across H-to-L here</text>
  <text x="1385" y="706" font-size="9" text-anchor="middle" fill="#8a1c1c">(far-end termination)</text>

  <line x1="640" y1="662" x2="686" y2="662" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="663" y="653" font-size="8.5" text-anchor="middle" fill="#556">2 wires</text>
  <line x1="880" y1="672" x2="986" y2="672" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="933" y="663" font-size="8.5" text-anchor="middle" fill="#556">CANH + CANL · twisted</text>
  <line x1="1180" y1="672" x2="1286" y2="672" stroke="#556" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1233" y="663" font-size="8.5" text-anchor="middle" fill="#556">same pair continues</text>
  <text x="1085" y="772" font-size="9" text-anchor="middle" fill="#8a6a2f">pigtails cross the pan/tilt joints as droopy service loops</text>

  <path d="M 1050 750 L 1050 820" fill="none" stroke="#d62828" stroke-width="3.5"/><circle cx="1050" cy="820" r="4" fill="#d62828"/>
  <path d="M 1090 750 L 1090 852" fill="none" stroke="#222" stroke-width="3.5"/><circle cx="1090" cy="852" r="4" fill="#222"/>
  <path d="M 1350 750 L 1350 820" fill="none" stroke="#d62828" stroke-width="3.5"/><circle cx="1350" cy="820" r="4" fill="#d62828"/>
  <path d="M 1390 750 L 1390 852" fill="none" stroke="#222" stroke-width="3.5"/><circle cx="1390" cy="852" r="4" fill="#222"/>

  <!-- bulk cap between trunks -->
  <circle cx="950" cy="820" r="4" fill="#d62828"/>
  <path d="M 950 820 L 950 828" fill="none" stroke="#d62828" stroke-width="3"/>
  <line x1="941" y1="828" x2="959" y2="828" stroke="#d62828" stroke-width="3"/>
  <line x1="941" y1="836" x2="959" y2="836" stroke="#222" stroke-width="3"/>
  <path d="M 950 836 L 950 852" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="950" cy="852" r="4" fill="#222"/>
  <text x="964" y="840" font-size="8.5" fill="#8a1c1c">1000–2200 µF — absorbs motor peaks</text>

  <!-- side view / anatomy -->
  <rect x="24" y="412" width="260" height="292" fill="#fbfbf7" stroke="#888" stroke-width="1.2" rx="8"/>
  <text x="36" y="432" font-size="10" font-weight="bold" fill="#333">What you're building — side view</text>
  <rect x="54" y="444" width="200" height="24" fill="#f3f3f3" stroke="#666" rx="4"/>
  <text x="154" y="460" font-size="8.5" text-anchor="middle" fill="#223">ceiling lamp socket (E26)</text>
  <line x1="154" y1="468" x2="154" y2="474" stroke="#999" stroke-width="2"/>
  <rect x="54" y="474" width="200" height="24" fill="#f3f3f3" stroke="#666" rx="4"/>
  <text x="154" y="490" font-size="8.5" text-anchor="middle" fill="#223">socket-to-wire adapter</text>
  <line x1="154" y1="498" x2="154" y2="504" stroke="#999" stroke-width="2"/>
  <rect x="54" y="504" width="200" height="28" fill="#ffe9e6" stroke="#d62828" rx="4"/>
  <text x="154" y="522" font-size="8.5" text-anchor="middle" fill="#8a1c1c">fixture body — IRM PSU (terminal cover on)</text>
  <line x1="154" y1="532" x2="154" y2="538" stroke="#999" stroke-width="2"/>
  <rect x="54" y="538" width="200" height="24" fill="#fdeaea" stroke="#a33" rx="4"/>
  <text x="154" y="554" font-size="8.5" text-anchor="middle" fill="#8a1c1c">B1 · POWER — trunks, buck, PicoBuck</text>
  <line x1="154" y1="562" x2="154" y2="568" stroke="#999" stroke-width="2"/>
  <rect x="54" y="568" width="200" height="24" fill="#fdf6ec" stroke="#a8792a" rx="4"/>
  <text x="154" y="584" font-size="8.5" text-anchor="middle" fill="#6b4c12">B2 · DRIVERS — PCAs, ULNs, zone plugs</text>
  <line x1="154" y1="592" x2="154" y2="598" stroke="#999" stroke-width="2"/>
  <rect x="54" y="598" width="200" height="24" fill="#eef3fb" stroke="#334" rx="4"/>
  <text x="154" y="614" font-size="8.5" text-anchor="middle" fill="#223">B3 · LOGIC — C6 + CAN (USB reachable)</text>
  <line x1="154" y1="622" x2="154" y2="628" stroke="#999" stroke-width="2"/>
  <rect x="54" y="628" width="200" height="24" fill="#f2f6fc" stroke="#33538a" rx="4"/>
  <text x="154" y="644" font-size="8.5" text-anchor="middle" fill="#33538a">yoke + spotlight head (pan/tilt)</text>
  <text x="154" y="666" font-size="8" text-anchor="middle" fill="#666">tape ring wraps the body — zone plugs exit B2</text>
  <text x="154" y="678" font-size="8" text-anchor="middle" fill="#666">boards are built flat on the desk, stacked last,</text>
  <text x="154" y="690" font-size="8" text-anchor="middle" fill="#666">inter-board wires cut with slack (1.5× the gap)</text>

  <!-- traps strip -->
  <text x="30" y="912" font-size="10" font-weight="bold" fill="#8a1c1c">The six traps, pre-solved (each also appears on its step page):</text>
  <g font-size="9" fill="#7c2a2a">
    <text x="30" y="930">1 · PCA9685 VCC gets 3V3 — never 5 V (and V+ stays unconnected)</text>
    <text x="30" y="946">2 · PicoBuck inputs get 10 kΩ pulldowns — floating = spot full-on at boot</text>
    <text x="30" y="962">3 · CAN must read ~60 Ω across H-to-L (120 Ω at SN65 + 120 Ω at tilt)</text>
    <text x="560" y="930">4 · label tape wires from the printed pad markings — fix wires, not software</text>
    <text x="560" y="946">5 · one ground star — nothing daisy-chained, motor current never via board traces</text>
    <text x="560" y="962">6 · flashing over USB? the stack's 24 V stays OFF (never dual-power the C6)</text>
  </g>
</svg>
