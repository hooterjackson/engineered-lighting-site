<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#111">Doc 4a · The second hub — two boards, the same two wires</text>
  <text x="30" y="57" font-size="12" fill="#555">Seven zones need 21 channels and a hub holds 16. The second board taps the bus the first is already on — same four wires, same order, no new C6 pins.</text>

  <rect x="30" y="66" width="356" height="24" fill="#fffbe8" stroke="#c9a227" stroke-width="1.5" rx="12"/>
  <text x="208" y="82" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#6b5200">DIRECTION: a board's far-end header is MIRRORED — read YOUR end's silkscreen</text>

  <!-- legend -->
  <circle cx="706" cy="92" r="4.5" fill="#222"/>
  <text x="718" y="96" font-size="9.5" fill="#555">= joined</text>
  <line x1="792" y1="84" x2="812" y2="100" stroke="#888" stroke-width="2"/>
  <line x1="812" y1="84" x2="792" y2="100" stroke="#888" stroke-width="2"/>
  <text x="822" y="96" font-size="9.5" fill="#555">= a crossing, not a join</text>

  <!-- ESP32 -->
  <rect x="40" y="120" width="220" height="190" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="150" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#223">ESP32-C6</text>
  <text x="150" y="170" font-size="10" text-anchor="middle" fill="#556">the ONE master · the ONE 3V3</text>
  <text x="150" y="206" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#223">Four wires leave here.</text>
  <text x="150" y="224" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#223">The second hub adds none.</text>
  <text x="150" y="258" font-size="9.5" text-anchor="middle" fill="#556">SDA = GPIO2 · SCL = GPIO3</text>
  <g font-size="9.5" font-weight="bold" text-anchor="middle" fill="#223">
    <text x="84" y="301">3V3</text>
    <text x="128" y="301">GND</text>
    <text x="172" y="301">SDA</text>
    <text x="216" y="301">SCL</text>
  </g>

  <!-- hub 1 -->
  <rect x="350" y="120" width="250" height="190" fill="#fdf6ec" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="475" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#223">PCA9685 #1</text>
  <text x="475" y="176" font-size="12" font-weight="bold" text-anchor="middle" fill="#3f7c55">A0 OPEN</text>
  <text x="475" y="194" font-size="11" text-anchor="middle" fill="#223">→ answers at 0x40</text>
  <text x="475" y="226" font-size="11" font-weight="bold" text-anchor="middle" fill="#8a6a2f">zones 1 – 5 · ch 0 – 14</text>
  <text x="475" y="246" font-size="9.5" text-anchor="middle" fill="#556">→ ULN chips 1 · 2 · 3</text>
  <text x="475" y="268" font-size="9" text-anchor="middle" fill="#8a8a8a">15 of 16 channels used</text>
  <g font-size="9.5" font-weight="bold" text-anchor="middle" fill="#223">
    <text x="394" y="301">VCC</text>
    <text x="438" y="301">GND</text>
    <text x="482" y="301">SDA</text>
    <text x="526" y="301">SCL</text>
  </g>

  <!-- hub 2 -->
  <rect x="700" y="120" width="250" height="190" fill="#fdf6ec" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="825" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#223">PCA9685 #2</text>
  <text x="825" y="176" font-size="12" font-weight="bold" text-anchor="middle" fill="#8a1c1c">A0 BRIDGED</text>
  <text x="825" y="194" font-size="11" text-anchor="middle" fill="#223">→ answers at 0x41</text>
  <text x="825" y="226" font-size="11" font-weight="bold" text-anchor="middle" fill="#8a6a2f">zones 6 – 7 · ch 0 – 5</text>
  <text x="825" y="246" font-size="9.5" text-anchor="middle" fill="#556">→ ULN chips 3 · 4</text>
  <text x="825" y="268" font-size="9" text-anchor="middle" fill="#8a8a8a">6 of 16 channels used</text>
  <g font-size="9.5" font-weight="bold" text-anchor="middle" fill="#223">
    <text x="744" y="301">VCC</text>
    <text x="788" y="301">GND</text>
    <text x="832" y="301">SDA</text>
    <text x="876" y="301">SCL</text>
  </g>
  <!-- solder blob glyph -->
  <rect x="904" y="130" width="12" height="9" fill="#d9a441" stroke="#8a6a2f"/>
  <rect x="922" y="130" width="12" height="9" fill="#d9a441" stroke="#8a6a2f"/>
  <rect x="914" y="132" width="10" height="5" fill="#8a6a2f"/>
  <text x="919" y="152" font-size="8" text-anchor="middle" fill="#8a6a2f">A0</text>

  <!-- drops: same left-to-right order at every device -->
  <g stroke-width="3">
    <line x1="84"  y1="310" x2="84"  y2="370" stroke="#7b2d8b"/>
    <line x1="128" y1="310" x2="128" y2="402" stroke="#222"/>
    <line x1="172" y1="310" x2="172" y2="434" stroke="#1d6fd6"/>
    <line x1="216" y1="310" x2="216" y2="466" stroke="#0e8a7a"/>
    <line x1="394" y1="310" x2="394" y2="370" stroke="#7b2d8b"/>
    <line x1="438" y1="310" x2="438" y2="402" stroke="#222"/>
    <line x1="482" y1="310" x2="482" y2="434" stroke="#1d6fd6"/>
    <line x1="526" y1="310" x2="526" y2="466" stroke="#0e8a7a"/>
    <line x1="744" y1="310" x2="744" y2="370" stroke="#7b2d8b"/>
    <line x1="788" y1="310" x2="788" y2="402" stroke="#222"/>
    <line x1="832" y1="310" x2="832" y2="434" stroke="#1d6fd6"/>
    <line x1="876" y1="310" x2="876" y2="466" stroke="#0e8a7a"/>
  </g>

  <!-- rails, tap-to-tap -->
  <g stroke-width="3.5">
    <line x1="84"  y1="370" x2="744" y2="370" stroke="#7b2d8b"/>
    <line x1="128" y1="402" x2="788" y2="402" stroke="#222"/>
    <line x1="172" y1="434" x2="832" y2="434" stroke="#1d6fd6"/>
    <line x1="216" y1="466" x2="876" y2="466" stroke="#0e8a7a"/>
  </g>
  <g font-size="10" font-weight="bold">
    <text x="756" y="374" fill="#7b2d8b">3.3 V</text>
    <text x="800" y="406" fill="#222">GND</text>
    <text x="844" y="438" fill="#1d6fd6">SDA</text>
    <text x="888" y="470" fill="#0e8a7a">SCL</text>
  </g>

  <!-- junction dots at every landing -->
  <g fill="#222">
    <circle cx="84"  cy="370" r="4.5"/><circle cx="394" cy="370" r="4.5"/><circle cx="744" cy="370" r="4.5"/>
    <circle cx="128" cy="402" r="4.5"/><circle cx="438" cy="402" r="4.5"/><circle cx="788" cy="402" r="4.5"/>
    <circle cx="172" cy="434" r="4.5"/><circle cx="482" cy="434" r="4.5"/><circle cx="832" cy="434" r="4.5"/>
    <circle cx="216" cy="466" r="4.5"/><circle cx="526" cy="466" r="4.5"/><circle cx="876" cy="466" r="4.5"/>
  </g>

  <text x="500" y="506" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">ONE BUS — the same four wires, in the same order, at every board. The blob is the only difference.</text>

  <!-- notes -->
  <rect x="40" y="528" width="296" height="112" fill="#fdecec" stroke="#c33" rx="6"/>
  <text x="52" y="549" font-size="10" font-weight="bold" fill="#8a1c1c">AN UNBRIDGED #2 IS A SECOND 0x40</text>
  <g font-size="9.5" fill="#7c2a2a">
    <text x="52" y="568">Both boards answer at once, and the traffic</text>
    <text x="52" y="583">for zones 1–5 gets corrupted by the newcomer.</text>
    <text x="52" y="598">Bridge A0 unpowered, before its wires land —</text>
  </g>
  <text x="52" y="617" font-size="9.5" font-weight="bold" fill="#8a1c1c">then prove it: CP8b (~0 Ω) and CP8c (0x41).</text>

  <rect x="352" y="528" width="296" height="112" fill="#fffbe8" stroke="#c9a227" rx="6"/>
  <text x="364" y="549" font-size="10" font-weight="bold" fill="#6b5200">WHERE THE FOUR WIRES MEET</text>
  <g font-size="9.5" fill="#514000">
    <text x="364" y="568">Breadboard: one row per signal — four rows,</text>
    <text x="364" y="583">and every wire is its own beep test.</text>
    <text x="364" y="598">Chained: the far-end header is MIRRORED —</text>
    <text x="364" y="613">read the silkscreen, never copy the near end.</text>
  </g>

  <rect x="664" y="528" width="296" height="112" fill="#fbfbf7" stroke="#888" stroke-width="1.2" rx="6"/>
  <text x="676" y="549" font-size="10" font-weight="bold" fill="#333">ONE THING DOUBLES</text>
  <g font-size="9.5" fill="#444">
    <text x="676" y="568">Two boards = two sets of SDA/SCL pull-ups</text>
    <text x="676" y="583">in parallel — half the resistance the bus had.</text>
    <text x="676" y="598">Harmless at two hubs, at 400 kHz, over a</text>
    <text x="676" y="613">bench-length run. A question at four hubs.</text>
  </g>
</svg>
