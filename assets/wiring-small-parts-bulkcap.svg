<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#111">Doc 8 · The one 1000 µF — the motors' bucket</text>
  <text x="30" y="57" font-size="12" fill="#555">Across both trunks, exactly at the motors' power tap — and the stripe on the can lands on the ground side. Always.</text>

  <rect x="700" y="66" width="270" height="26" fill="#fdecec" stroke="#c33" stroke-width="1.5" rx="13"/>
  <text x="835" y="83" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8a1c1c">POLARITY: YES — stripe = − = ground</text>

  <!-- B1 board -->
  <rect x="40" y="100" width="920" height="330" fill="#fbf6ee" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="56" y="126" font-size="12.5" font-weight="bold" fill="#223">B1 · POWER</text>

  <!-- +24 trunk -->
  <line x1="80" y1="190" x2="920" y2="190" stroke="#d62828" stroke-width="4"/>
  <text x="80" y="180" font-size="10" font-weight="bold" fill="#8a1c1c">+24 V trunk</text>
  <!-- fuse -->
  <rect x="150" y="178" width="64" height="24" fill="#fffbe8" stroke="#c9a227" stroke-width="1.5" rx="4"/>
  <text x="182" y="194" font-size="9" font-weight="bold" text-anchor="middle" fill="#6b5200">T3.15A</text>
  <text x="182" y="164" font-size="8.5" text-anchor="middle" fill="#556">laid in step 1</text>

  <!-- gnd trunk -->
  <line x1="80" y1="330" x2="920" y2="330" stroke="#222" stroke-width="4"/>
  <text x="80" y="352" font-size="10" font-weight="bold" fill="#222">ground trunk</text>

  <!-- the can -->
  <g>
    <line x1="640" y1="190" x2="640" y2="218" stroke="#d62828" stroke-width="3"/>
    <line x1="640" y1="302" x2="640" y2="330" stroke="#222" stroke-width="3"/>
    <rect x="618" y="218" width="44" height="84" fill="#2f2f3a" stroke="#111" stroke-width="1.5" rx="6"/>
    <rect x="618" y="260" width="12" height="42" fill="#d7d7e2" rx="3"/>
    <text x="624" y="284" font-size="12" font-weight="bold" fill="#333">−</text>
    <text x="672" y="240" font-size="10" font-weight="bold" fill="#223">1000 µF · 35 V</text>
    <text x="672" y="255" font-size="9" fill="#556">low-ESR electrolytic</text>
    <circle cx="640" cy="190" r="4.5" fill="#d62828"/>
    <circle cx="640" cy="330" r="4.5" fill="#222"/>
  </g>
  <line x1="634" y1="210" x2="596" y2="176" stroke="#d62828" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="590" y="172" font-size="9.5" font-weight="bold" text-anchor="end" fill="#d62828">the + leg → +24 V trunk</text>
  <line x1="612" y1="286" x2="560" y2="300" stroke="#c33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="554" y="296" font-size="9.5" font-weight="bold" text-anchor="end" fill="#8a1c1c">the STRIPE side (the shorter leg) → ground trunk</text>

  <!-- motor taps -->
  <g stroke-width="3">
    <line x1="800" y1="190" x2="800" y2="150" stroke="#d62828"/>
    <line x1="800" y1="150" x2="880" y2="150" stroke="#d62828"/>
    <line x1="860" y1="330" x2="860" y2="370" stroke="#222"/>
    <line x1="860" y1="370" x2="880" y2="370" stroke="#222"/>
  </g>
  <g fill="#223" font-size="9.5" font-weight="bold">
    <text x="886" y="154">XT30 + → motors</text>
    <text x="886" y="374">XT30 − → motors</text>
  </g>
  <circle cx="800" cy="190" r="4.5" fill="#d62828"/>
  <circle cx="860" cy="330" r="4.5" fill="#222"/>

  <!-- the gulp -->
  <g stroke="#d62828" stroke-width="2" fill="none">
    <polyline points="742,246 754,246 758,226 764,266 770,238 776,246 790,246"/>
  </g>
  <text x="766" y="286" font-size="9" text-anchor="middle" fill="#7c2a2a">the gulp: a move starts =</text>
  <text x="766" y="299" font-size="9" text-anchor="middle" fill="#7c2a2a">a few amps for a few milliseconds</text>

  <text x="360" y="248" font-size="10.5" font-weight="bold" fill="#333">The can solders across the two trunks</text>
  <text x="360" y="264" font-size="10.5" font-weight="bold" fill="#333">AT the motors' tap — placed in step 6,</text>
  <text x="360" y="280" font-size="10.5" font-weight="bold" fill="#333">spanning the trunks step 1 laid down.</text>

  <!-- notes -->
  <rect x="40" y="460" width="296" height="150" fill="#fdecec" stroke="#c33" rx="6"/>
  <text x="52" y="481" font-size="10" font-weight="bold" fill="#8a1c1c">THE STRIPE IS THE NEGATIVE LEG</text>
  <g font-size="9.5" fill="#7c2a2a">
    <text x="52" y="500">It lands on the ground trunk, always —</text>
    <text x="52" y="515">the other leg on +24 V. On a fresh part</text>
    <text x="52" y="530">the negative leg is also the SHORTER</text>
    <text x="52" y="545">one: stripe and short leg agree, so you</text>
    <text x="52" y="560">have two witnesses. Installed backwards,</text>
    <text x="52" y="575">electrolytics fail loudly and sometimes</text>
    <text x="52" y="590">wetly. Check twice, then solder.</text>
  </g>

  <rect x="352" y="460" width="296" height="150" fill="#fffbe8" stroke="#c9a227" rx="6"/>
  <text x="364" y="481" font-size="10" font-weight="bold" fill="#6b5200">EXACTLY ONE, EXACTLY HERE</text>
  <g font-size="9.5" fill="#514000">
    <text x="364" y="500">At the tap the motors drink from — not</text>
    <text x="364" y="515">somewhere convenient. Without it, a</text>
    <text x="364" y="530">motor's starting gulp sags the 24 V rail</text>
    <text x="364" y="545">for an instant, and that sag reads as</text>
    <text x="364" y="560">mystery reboots of everything else on</text>
    <text x="364" y="575">the fixture. The bucket hands over the</text>
    <text x="364" y="590">gulp so the rail never notices.</text>
  </g>

  <rect x="664" y="460" width="296" height="150" fill="#fbfbf7" stroke="#888" stroke-width="1.2" rx="6"/>
  <text x="676" y="481" font-size="10" font-weight="bold" fill="#333">THE FINE PRINT</text>
  <g font-size="9.5" fill="#444">
    <text x="676" y="500">· 35 V rating = comfortable margin</text>
    <text x="676" y="515">  over the 24 V it rides.</text>
    <text x="676" y="530">· Low-ESR = it can hand the gulp</text>
    <text x="676" y="545">  over fast enough to matter.</text>
    <text x="676" y="560">· Start at 1000 µF — if the fixture's</text>
    <text x="676" y="575">  IRM supply hiccups at power-on,</text>
    <text x="676" y="590">  the cap is too big (the BoM's rule).</text>
  </g>
</svg>
