<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#fff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#111">Step 1 · Power backbone — the two rails everything drinks from</text>
  <text x="30" y="53" font-size="11" fill="#555">Wire this first, test it empty. Nothing else connects until these numbers are right.</text>
  <rect x="30" y="58" width="410" height="20" fill="#fffbe8" stroke="#c9a227" stroke-width="1.5" rx="11"/>
  <text x="235" y="72" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#6b5200">ORDER: the IRM waits until step 7 — bench feed + 2 A limit until then</text>

  <rect x="40" y="80" width="170" height="58" fill="#f3f3f3" stroke="#666" stroke-width="1.5" rx="8"/>
  <text x="125" y="102" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">E26 socket-to-wire</text>
  <text x="125" y="118" font-size="9" text-anchor="middle" fill="#555">120 VAC · 18 AWG leads</text>

  <line x1="90" y1="138" x2="90" y2="180" stroke="#555" stroke-width="3"/>
  <line x1="160" y1="138" x2="160" y2="180" stroke="#999" stroke-width="3"/>
  <text x="80" y="162" font-size="9" text-anchor="end" fill="#555">L</text>
  <text x="170" y="162" font-size="9" fill="#777">N</text>

  <rect x="40" y="180" width="170" height="100" fill="#ffe9e6" stroke="#d62828" stroke-width="2" rx="8"/>
  <text x="125" y="202" font-size="12" font-weight="bold" text-anchor="middle" fill="#8a1c1c">IRM-90-24ST</text>
  <text x="125" y="217" font-size="9" text-anchor="middle" fill="#8a1c1c">24 V · 90 W · screw terminals</text>
  <text x="125" y="232" font-size="9" text-anchor="middle" fill="#555">mounts to the fixture body</text>
  <g font-size="10" fill="#223"><text x="204" y="252" text-anchor="end">+V</text><text x="204" y="270" text-anchor="end">−V</text></g>
  <text x="125" y="296" font-size="9" text-anchor="middle" fill="#8a6a2f">mount it now — CONNECT IT LAST (after step 6)</text>

  <path d="M 210 248 L 250 248" fill="none" stroke="#d62828" stroke-width="4"/>
  <rect x="250" y="239" width="46" height="18" fill="#fff" stroke="#8a1c1c" stroke-width="1.5" rx="4"/>
  <text x="273" y="252" font-size="9" text-anchor="middle" fill="#8a1c1c">3 A SB</text>
  <path d="M 296 248 L 400 248" fill="none" stroke="#d62828" stroke-width="4"/>
  <line x1="330" y1="240" x2="338" y2="256" stroke="#fff" stroke-width="6"/>
  <line x1="330" y1="240" x2="338" y2="256" stroke="#8a1c1c" stroke-width="1.5"/>
  <line x1="336" y1="240" x2="344" y2="256" stroke="#8a1c1c" stroke-width="1.5"/>
  <rect x="308" y="262" width="90" height="30" fill="#fdecec" stroke="#c33" rx="4"/>
  <text x="353" y="274" font-size="8" text-anchor="middle" fill="#8a1c1c" font-weight="bold">BENCH FEED — XT30</text>
  <text x="353" y="285" font-size="8" text-anchor="middle" fill="#8a1c1c">bench supply plugs in here</text>

  <line x1="400" y1="248" x2="950" y2="248" stroke="#d62828" stroke-width="7"/>
  <text x="420" y="238" font-size="11" font-weight="bold" fill="#8a1c1c">+24 V BUS — solid 16–18 AWG tinned bus wire, soldered along Board 1</text>

  <path d="M 210 266 L 290 266 L 290 480 L 400 480" fill="none" stroke="#222" stroke-width="4"/>
  <line x1="400" y1="480" x2="950" y2="480" stroke="#222" stroke-width="7"/>
  <circle cx="400" cy="480" r="6" fill="#222"/>
  <text x="420" y="470" font-size="11" font-weight="bold" fill="#111">GND STAR — one point on Board 1; every ground in later steps lands HERE, none chained</text>

  <rect x="480" y="300" width="190" height="96" fill="#e8f4fd" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="575" y="322" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">Pololu D24V22F5 buck</text>
  <text x="575" y="337" font-size="9" text-anchor="middle" fill="#555">24 V → 5 V · 2.5 A · Board 1</text>
  <g font-size="10" fill="#223"><text x="488" y="360">VIN</text><text x="488" y="378">GND</text><text x="662" y="360" text-anchor="end">VOUT 5V</text></g>
  <path d="M 510 248 L 510 300" fill="none" stroke="#d62828" stroke-width="3"/><circle cx="510" cy="248" r="4" fill="#d62828"/>
  <path d="M 530 396 L 530 480" fill="none" stroke="#222" stroke-width="3"/><circle cx="530" cy="480" r="4" fill="#222"/>
  <path d="M 670 356 L 720 356" fill="none" stroke="#c2185b" stroke-width="3"/>
  <text x="726" y="360" font-size="9" fill="#c2185b">5 V — feeds the C6 in step 2 (nothing else)</text>

  <rect x="710" y="80" width="260" height="132" fill="#f2fbf4" stroke="#3f7c55" stroke-width="1.5" rx="8"/>
  <text x="722" y="100" font-size="11" font-weight="bold" fill="#3f7c55">MULTIMETER RITUAL (power off → on)</text>
  <g font-size="9.5" fill="#2f5c40">
    <text x="722" y="120">1 · continuity: bus never touches star</text>
    <text x="722" y="138">2 · bench supply on: 24.0 V bus → star</text>
    <text x="722" y="156">3 · buck output reads 5.0 V</text>
    <text x="722" y="174">4 · 0 Ω between every ground point</text>
    <text x="722" y="192">5 · nothing warm after 5 minutes</text>
  </g>

  <rect x="40" y="330" width="240" height="112" fill="#fdecec" stroke="#c33" rx="6"/>
  <text x="52" y="350" font-size="10" font-weight="bold" fill="#8a1c1c">AC safety — non-negotiable</text>
  <g font-size="9" fill="#7c2a2a">
    <text x="52" y="368">· treat BOTH leads as live — socket</text>
    <text x="52" y="380">  polarity is never guaranteed</text>
    <text x="52" y="394">· heat-shrink every AC terminal</text>
    <text x="52" y="408">· strain-relief the cord at entry</text>
    <text x="52" y="422">· no wall dimmer on this circuit</text>
  </g>

  <rect x="40" y="530" width="930" height="60" fill="#f2fbf4" stroke="#3f7c55" stroke-width="1.5" rx="8"/>
  <text x="56" y="554" font-size="11" font-weight="bold" fill="#3f7c55">DONE WHEN</text>
  <text x="56" y="572" font-size="10" fill="#2f5c40">Bench supply on the XT30 feed (current limit 2 A): 24 V at the bus, 5 V from the buck, one solid star ground, nothing warm. The IRM stays disconnected until the whole stack passes step 6.</text>
</svg>
