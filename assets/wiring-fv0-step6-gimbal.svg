<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#fff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#111">Step 6 · The gimbal — two smart motors, one twisted pair</text>
  <text x="30" y="53" font-size="11" fill="#555">The motors arrive already addressed from the bench (Doc 3 stage 6: pan 0x141, tilt 0x142) — this step is wiring, not configuration.</text>
  <rect x="30" y="55" width="520" height="22" fill="#fdecec" stroke="#c33" stroke-width="1.5" rx="11"/>
  <text x="290" y="70" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8a1c1c">POLARITY: motor power reversed = FATAL · CAN pair swapped = harmless · ~60 Ω before power</text>

  <rect x="40" y="90" width="150" height="150" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="115" y="112" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">ESP32-C6 (B3)</text>
  <g font-size="10" fill="#223" text-anchor="end">
    <text x="182" y="146">3V3</text>
    <text x="182" y="176">GPIO6 · TX</text>
    <text x="182" y="206">GPIO7 · RX</text>
  </g>

  <rect x="290" y="90" width="180" height="170" fill="#f2ecfa" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="380" y="112" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">SN65HVD230 (B3)</text>
  <g font-size="10" fill="#223">
    <text x="298" y="142">3V3</text>
    <text x="298" y="172">CTX</text>
    <text x="298" y="202">CRX</text>
    <text x="298" y="232">GND → B3 return</text>
    <text x="462" y="142" text-anchor="end">CANH</text>
    <text x="462" y="172" text-anchor="end">CANL</text>
  </g>
  <text x="380" y="252" font-size="9" text-anchor="middle" fill="#8a6a2f">onboard 120 Ω = near-end termination</text>

  <line x1="190" y1="142" x2="290" y2="138" stroke="#7b2d8b" stroke-width="3"/>
  <line x1="190" y1="172" x2="290" y2="168" stroke="#556" stroke-width="3"/>
  <line x1="190" y1="202" x2="290" y2="198" stroke="#889" stroke-width="3"/>

  <path d="M 470 138 L 560 138 L 560 150" fill="none" stroke="#e67e22" stroke-width="3"/>
  <path d="M 470 168 L 568 168 L 568 150" fill="none" stroke="#8b5a2b" stroke-width="3"/>
  <text x="516" y="126" font-size="9" fill="#a05a10">lightly twist the pair</text>
  <circle cx="560" cy="152" r="3.5" fill="#e67e22"/><circle cx="568" cy="152" r="3.5" fill="#8b5a2b"/>
  <text x="584" y="148" font-size="8.5" fill="#a05a10">Y-splice near yoke</text>
  <text x="584" y="160" font-size="8.5" fill="#a05a10">keep stubs short</text>
  <path d="M 560 152 L 560 200 L 660 200 L 660 300" fill="none" stroke="#e67e22" stroke-width="3"/>
  <path d="M 568 152 L 568 208 L 668 208 L 668 300" fill="none" stroke="#8b5a2b" stroke-width="3"/>
  <path d="M 560 200 L 500 200 L 500 300" fill="none" stroke="#e67e22" stroke-width="3"/>
  <path d="M 568 208 L 508 208 L 508 300" fill="none" stroke="#8b5a2b" stroke-width="3"/>

  <rect x="420" y="300" width="200" height="130" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="520" y="322" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">RMD-L-5005 · PAN · 0x141</text>
  <g font-size="10" fill="#223" text-anchor="middle">
    <text x="455" y="350">VCC</text><text x="495" y="350">GND</text><text x="545" y="350">CANH</text><text x="592" y="350">CANL</text>
  </g>
  <text x="520" y="378" font-size="9" text-anchor="middle" fill="#8a1c1c">power enters on an XT30 pair</text>
  <text x="520" y="394" font-size="9" text-anchor="middle" fill="#8a6a2f">pigtail crosses the pan joint as a</text>
  <text x="520" y="406" font-size="9" text-anchor="middle" fill="#8a6a2f">droopy service loop — never taut</text>

  <rect x="660" y="300" width="200" height="130" fill="#eef3fb" stroke="#334" stroke-width="1.5" rx="8"/>
  <text x="760" y="322" font-size="12" font-weight="bold" text-anchor="middle" fill="#223">RMD-L-5005 · TILT · 0x142</text>
  <g font-size="10" fill="#223" text-anchor="middle">
    <text x="695" y="350">VCC</text><text x="735" y="350">GND</text><text x="785" y="350">CANH</text><text x="832" y="350">CANL</text>
  </g>
  <text x="760" y="378" font-size="9" text-anchor="middle" fill="#8a1c1c" font-weight="bold">solder 120 Ω across CANH–CANL here</text>
  <text x="760" y="392" font-size="9" text-anchor="middle" fill="#8a1c1c">(far-end termination)</text>
  <text x="760" y="410" font-size="9" text-anchor="middle" fill="#8a6a2f">service loop across the tilt joint</text>

  <line x1="40" y1="480" x2="960" y2="480" stroke="#d62828" stroke-width="6"/>
  <text x="46" y="470" font-size="10" font-weight="bold" fill="#8a1c1c">+24 V BUS</text>
  <line x1="40" y1="516" x2="960" y2="516" stroke="#222" stroke-width="6"/>
  <text x="46" y="536" font-size="10" font-weight="bold" fill="#111">GND STAR</text>
  <path d="M 455 480 L 455 430" fill="none" stroke="#d62828" stroke-width="3.5"/><circle cx="455" cy="480" r="4" fill="#d62828"/>
  <path d="M 495 516 L 495 430" fill="none" stroke="#222" stroke-width="3.5"/><circle cx="495" cy="516" r="4" fill="#222"/>
  <path d="M 695 480 L 695 430" fill="none" stroke="#d62828" stroke-width="3.5"/><circle cx="695" cy="480" r="4" fill="#d62828"/>
  <path d="M 735 516 L 735 430" fill="none" stroke="#222" stroke-width="3.5"/><circle cx="735" cy="516" r="4" fill="#222"/>
  <text x="805" y="452" font-size="9" fill="#8a1c1c">18 AWG, direct from the rails —</text>
  <text x="805" y="464" font-size="9" fill="#8a1c1c">never through board traces</text>

  <circle cx="900" cy="480" r="4" fill="#d62828"/>
  <path d="M 900 480 L 900 490" fill="none" stroke="#d62828" stroke-width="3"/>
  <line x1="891" y1="490" x2="909" y2="490" stroke="#d62828" stroke-width="3"/>
  <line x1="891" y1="497" x2="909" y2="497" stroke="#222" stroke-width="3"/>
  <path d="M 900 497 L 900 516" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="900" cy="516" r="4" fill="#222"/>
  <text x="916" y="498" font-size="8.5" fill="#8a1c1c">bulk cap</text>

  <rect x="700" y="80" width="280" height="120" fill="#fdecec" stroke="#c33" rx="6"/>
  <text x="712" y="100" font-size="10" font-weight="bold" fill="#8a1c1c">Before power: the 60 Ω ritual + safety</text>
  <g font-size="9" fill="#7c2a2a">
    <text x="712" y="118">· everything OFF: meter across CANH–CANL</text>
    <text x="712" y="132">  must read ~60 Ω (two 120s in parallel)</text>
    <text x="712" y="146">· ~120 Ω = a terminator missing · open = both</text>
    <text x="712" y="164">· first moves: hand near the supply switch,</text>
    <text x="712" y="178">  current limit set — motors twist their bodies</text>
  </g>

  <rect x="40" y="550" width="930" height="56" fill="#f2fbf4" stroke="#3f7c55" stroke-width="1.5" rx="8"/>
  <text x="56" y="572" font-size="11" font-weight="bold" fill="#3f7c55">DONE WHEN</text>
  <text x="56" y="590" font-size="10" fill="#2f5c40">Both motors answer an angle read (0x92) over the fixture's wiring, and the HA pan/tilt sliders move the beam — with all 7 zones lit. Stack proven → swap the bench feed for the IRM, re-test once.</text>
</svg>
